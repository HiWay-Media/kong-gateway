# The whole system, running: a real identity provider, a real upstream, and the image under test
# between them.
#
# tests/smoke.sh proves the plugins LOAD. That is not the same as proving they DO anything: an
# authorization plugin that loads but permits everything satisfies every load-time check ever
# written. Here the plugins are configured and driven through Kong's proxy port, and what is
# asserted is mostly what must be REFUSED.
#
# Started by tests/e2e/run.sh, which owns the waiting and the teardown.

name: kong-gateway-e2e

services:
  # Both Kong and Keycloak run on Postgres here, as they do in production. The suite runs either
  # way — `tests/e2e/run.sh --db postgres` — because the storage mode changes real behaviour:
  # DB-less Kong is configured by a declarative file and has no Admin API, while a Postgres Kong is
  # configured through migrations and a config loaded over that API. Testing only one of them proves
  # the plugins work under a configuration model that may not be the one in use.
  postgres:
    image: postgres:14-alpine
    profiles: ['db']
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kong']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: bootstraps Kong's schema and imports the same declarative file the DB-less mode reads,
  # so both modes are configured from one source rather than from two that drift.
  kong-migrations:
    image: ${KONG_IMAGE:?set KONG_IMAGE, or run tests/e2e/run.sh}
    platform: ${KONG_PLATFORM:-linux/amd64}
    profiles: ['db']
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=postgres
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
      - KONG_PLUGINS=${KONG_PLUGINS_LIST:-bundled,jwt-keycloak,oidc,kong-path-allow}
      - KONG_PLUGINSERVER_NAMES
      - KONG_PLUGINSERVER_OIDCIFY_QUERY_CMD
      - KONG_PLUGINSERVER_OIDCIFY_START_CMD
    volumes:
      - ${KONG_CONFIG:-./kong/kong.yml}:/kong/kong.yml:ro
    entrypoint: ['sh', '-c']
    # Only the schema. The configuration is loaded afterwards with decK, through the Admin API:
    # `kong config db_import` cannot read a config containing an EXTERNAL plugin — on Kong 3.9 it
    # dies in load_external_plugins with "attempt to index upvalue 'kong' (a nil value)", because
    # the CLI has no runtime to ask the plugin server for its schema. decK talks to a running Kong,
    # which does, and is how a database-backed Kong is configured in practice anyway.
    command: ['kong migrations bootstrap']

  # Loads the same declarative file into a running Kong through the Admin API, so both storage
  # modes are configured from one source instead of two that drift.
  deck:
    image: kong/deck:v1.40.3
    profiles: ['db']
    entrypoint: ['sh', '-c']
    volumes:
      - ${KONG_CONFIG:-./kong/kong.yml}:/kong/kong.yml:ro

  # Fixed KC_HOSTNAME so the issuer is always http://keycloak:8080/realms/kong, whether the token is
  # requested from the host or from inside the network. jwt-keycloak matches tokens against
  # allowed_iss and fetches the realm keys from that same URL: a drifting issuer is the classic
  # reason this plugin rejects perfectly valid tokens.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      # Empty unless the db profile is on: Keycloak then falls back to its dev file database, which
      # is what `start-dev` uses and what it warns is not for production.
      KC_DB: ${KC_DB:-}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST:-}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:-}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
    volumes:
      - ./keycloak/realm-kong.json:/opt/keycloak/data/import/realm-kong.json:ro
    ports:
      - '127.0.0.1:18080:8080'

  upstream:
    image: nginx:1.27-alpine
    volumes:
      - ./upstream/default.conf:/etc/nginx/conf.d/default.conf:ro

  kong:
    # Set by tests/e2e/run.sh to the image under test.
    image: ${KONG_IMAGE:?set KONG_IMAGE, or run tests/e2e/run.sh}
    # The kong:*-ubuntu bases are amd64-only; on an arm64 workstation this runs under emulation.
    platform: ${KONG_PLATFORM:-linux/amd64}
    depends_on: [upstream, keycloak]
    # List form on purpose: a bare name is passed through only when it is set in the environment.
    # An EMPTY KONG_PLUGINSERVER_* is not the same as an unset one — Kong reads it as the boolean
    # true and refuses to start with "pluginserver_oidcify_start_cmd is not a string: 'true'". With
    # the mapping form there is no way to leave a key out, so the 2.x line could not start at all.
    environment:
      # DB-less by default; `run.sh --db postgres` switches it. The declarative config and the PG
      # settings are passed by bare name so that only the ones belonging to the active mode exist:
      # Kong refuses to start when told to use a database AND given a declarative file.
      - KONG_DATABASE=${KONG_DB_MODE:-off}
      - KONG_DECLARATIVE_CONFIG
      - KONG_PG_HOST
      - KONG_PG_USER
      - KONG_PG_PASSWORD
      # Set per Kong major by tests/e2e/run.sh: the 3.x line runs oidcify, which is a Go binary Kong
      # starts as an external plugin server rather than a Lua module it loads.
      - KONG_PLUGINS=${KONG_PLUGINS_LIST:-bundled,jwt-keycloak,oidc,kong-path-allow}
      # TLS as well as plain HTTP: the OIDC session cookie is marked Secure, so the browser flow
      # cannot complete over http — the cookie is never sent back and the callback fails with 400.
      # Kong generates a self-signed certificate in DB-less mode; the in-network browser accepts it.
      - KONG_PROXY_LISTEN=0.0.0.0:8000, 0.0.0.0:8443 ssl
      # Off in DB-less mode (there is nothing to write), on inside the network when a database is
      # in use, because that is the only way to configure it. Never published to the host.
      - KONG_ADMIN_LISTEN=${KONG_ADMIN_LISTEN_ADDR:-off}
      - KONG_LOG_LEVEL=notice
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_PLUGINSERVER_NAMES
      - KONG_PLUGINSERVER_OIDCIFY_QUERY_CMD
      - KONG_PLUGINSERVER_OIDCIFY_START_CMD
    volumes:
      - ${KONG_CONFIG:-./kong/kong.yml}:/kong/kong.yml:ro
    ports:
      - '127.0.0.1:18000:8000'

  # A browser, near enough: it runs inside the network, so the names in the OIDC round trip are the
  # ones that are actually configured. Started on demand by tests/e2e/run.sh, not by `up`.
  tester:
    image: curlimages/curl:8.11.1
    profiles: ['tools']
    entrypoint: ['sh']
    volumes:
      - ./tester:/t:ro
