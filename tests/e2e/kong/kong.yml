# Declarative config for the end-to-end stack. One upstream, three routes, one plugin each — so a
# failing assertion names exactly one plugin.
_format_version: "2.1"

services:
  - name: upstream
    url: http://upstream:80
    routes:
      # kong-path-allow: an allow-list. strip_path is on by default, so a request to /open/allowed
      # reaches the plugin as /allowed — matching what the plugin actually compares against.
      - name: open
        paths: ['/open']
        plugins:
          - name: kong-path-allow
            config:
              allow_paths: ['/allowed']
              regex: true

      # kong-path-allow matches with the start anchored and the end open — `/public` also permits
      # `/publicsecret`. That is documented as a warning; here it is asserted, so the day the plugin
      # changes behaviour the test says which way it changed rather than leaving a stale warning.
      - name: anchoring
        paths: ['/anchor']
        plugins:
          - name: kong-path-allow
            config:
              # `/exact$` and not `^/exact$`: Kong's path typedef rejects anything that does not
              # start with a slash, so the start cannot be anchored with `^` at all. Only the end
              # can — which the documentation used to get wrong.
              allow_paths: ['/public', '/exact$']
              regex: true

      # A role jwt-keycloak must find in the token, and one nobody holds. A role check that never
      # refuses anything is not a check, so both routes exist.
      - name: jwt-role-held
        paths: ['/role-ok']
        plugins:
          - name: jwt-keycloak
            config:
              allowed_iss: ['http://keycloak:8080/realms/kong']
              realm_roles: ['kong-user']

      - name: jwt-role-missing
        paths: ['/role-no']
        plugins:
          - name: jwt-keycloak
            config:
              allowed_iss: ['http://keycloak:8080/realms/kong']
              realm_roles: ['kong-admin']

      # jwt-keycloak: tokens must be signed by the realm and carry its issuer.
      - name: jwt
        paths: ['/jwt']
        plugins:
          - name: jwt-keycloak
            config:
              allowed_iss: ['http://keycloak:8080/realms/kong']

      # oidc: no token means no pass-through — the browser flow starts with a redirect.
      - name: oidc
        paths: ['/oidc']
        plugins:
          - name: oidc
            config:
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              discovery: http://keycloak:8080/realms/kong/.well-known/openid-configuration
              ssl_verify: 'no'
              # The callback has to be a path Kong routes somewhere: `/cb` alone matches no route
              # and the provider's redirect lands on a 404, which looks like a plugin failure and is
              # not one. Keeping it under the route's own prefix is what makes the flow completable.
              redirect_uri_path: /oidc/cb
