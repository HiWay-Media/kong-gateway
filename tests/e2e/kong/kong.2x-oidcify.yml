# Declarative config for the 2.x oidcify VARIANT: same Kong as production, same jwt-keycloak, with
# the abandoned kong-oidc swapped for a maintained plugin.
#
# That is the whole point of the variant. It separates two migrations that would otherwise arrive
# together: replacing a dead OIDC plugin, and jumping a Kong major. This config keeps `/jwt` exactly
# as the production line has it, so what is being tested is one change, not two.
_format_version: "2.1"

consumers:
  - username: oidcuser

services:
  - name: upstream
    url: http://upstream:80
    routes:
      - name: open
        paths: ['/open']
        plugins:
          - name: kong-path-allow
            config:
              allow_paths: ['/allowed']
              regex: true

      # Unchanged from the production line: jwt-keycloak still exists on Kong 2.x.
      - name: jwt
        paths: ['/jwt']
        plugins:
          - name: jwt-keycloak
            config:
              allowed_iss: ['http://keycloak:8080/realms/kong']

      # API style: an unusable token must produce 401, not a redirect into a browser flow.
      - name: api
        paths: ['/api']
        plugins:
          - name: oidcify
            config:
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/api/cb
              consumer_name: oidcuser
              bearer_jwt_allowed_auds: ['kong-e2e']
              redirect_unauthenticated: false
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100

      # Browser style: start the authorization code flow.
      - name: oidc
        paths: ['/oidc']
        plugins:
          - name: oidcify
            config:
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/oidc/cb
              consumer_name: oidcuser
              bearer_jwt_allowed_auds: ['kong-e2e']
              # The session cookie is Secure, so the flow only completes over TLS. In production
              # that is what you want; in a test it has to be arranged rather than assumed.
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
