# Declarative config for the Kong 3.x stack.
#
# Two differences from the 2.x file, and both are the point of this whole exercise:
#   - `oidc` is gone, replaced by `oidcify`, which is not a Lua plugin but a Go binary Kong runs as
#     an external plugin server;
#   - there is no `/jwt` route, because jwt-keycloak still has no Kong 3.x replacement. Its absence
#     here is deliberate: the 3.x image is not publishable yet, and pretending otherwise in the test
#     config would be the first step to forgetting.
_format_version: "3.0"

# oidcify attributes a successful request to a Kong consumer, which must exist.
consumers:
  - username: oidcuser

services:
  - name: upstream
    url: http://upstream:80
    routes:
      - name: open
        paths: ['/open']
        plugins:
          - name: kong-path-allow
            config:
              allow_paths: ['/allowed']
              regex: true

      # API style: no browser anywhere, so an unusable token must produce 401 rather than a redirect.
      # This is the route the refusals are asserted against — a challenge that redirects tells you
      # far less than one that refuses.
      - name: api
        paths: ['/api']
        plugins:
          - name: oidcify
            config:
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/api/cb
              consumer_name: oidcuser
              bearer_jwt_allowed_auds: ['kong-e2e']
              redirect_unauthenticated: false
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100

      - name: anchoring
        paths: ['/anchor']
        plugins:
          - name: kong-path-allow
            config:
              # `/exact$` and not `^/exact$`: Kong's path typedef rejects anything that does not
              # start with a slash, so the start cannot be anchored with `^` at all. Only the end
              # can — which the documentation used to get wrong.
              allow_paths: ['/public', '/exact$']
              regex: true

      # The other half of M3b, made concrete: oidcify does not validate roles, it puts the token's
      # groups into `authenticated_groups` and leaves authorization to Kong's bundled ACL plugin.
      # Two routes, because an allow-list that never refuses anything proves nothing.
      - name: group-allowed
        paths: ['/group-ok']
        plugins:
          - name: oidcify
            config: &oidcify_api
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/group-ok/cb
              consumer_name: oidcuser
              bearer_jwt_allowed_auds: ['kong-e2e']
              redirect_unauthenticated: false
              groups_claim: groups
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
          - name: acl
            config:
              allow: ['gateway-users']
              always_use_authenticated_groups: true

      - name: group-denied
        paths: ['/group-no']
        plugins:
          - name: oidcify
            config:
              <<: *oidcify_api
              redirect_uri: https://kong:8443/group-no/cb
          - name: acl
            config:
              allow: ['gateway-admins']
              always_use_authenticated_groups: true

      # The experiment behind M3b: can oidcify validate the ACCESS token, which is what
      # jwt-keycloak checks today? Keycloak issues access tokens with `aud: account`, so this route
      # allows that audience instead of the client's.
      - name: api-access
        paths: ['/api-access']
        plugins:
          - name: oidcify
            config:
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/api-access/cb
              consumer_name: oidcuser
              bearer_jwt_allowed_auds: ['account']
              redirect_unauthenticated: false
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100

      # Browser style: an unauthenticated request starts the authorization code flow.
      - name: oidc
        paths: ['/oidc']
        plugins:
          - name: oidcify
            config:
              issuer: http://keycloak:8080/realms/kong
              client_id: kong-e2e
              client_secret: kong-e2e-secret
              redirect_uri: https://kong:8443/oidc/cb
              consumer_name: oidcuser
              # Bearer JWT authentication is OFF unless an audience is allowed. oidcify validates the
              # ID token, whose `aud` is the client id — an access token (aud: account) is refused,
              # which is the behaviour worth asserting rather than assuming.
              bearer_jwt_allowed_auds: ['kong-e2e']
              # Fixed so a restart does not invalidate every session; in production these are secrets.
              cookie_hash_key_hex: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
              cookie_block_key_hex: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
