# Builds the Kong image, tests it against the milestone suite, and publishes it to GHCR.
#
# The order is deliberate: nothing is published before the milestone suite passes. The gate checks
# that kong-path-allow is a working authorization control, not merely a file that exists — a plugin
# that loads but no longer blocks anything would pass any healthcheck and be invisible to whoever
# pulls the image.
#
# Publishing happens only from an annotated `v*` tag or a manual dispatch that asks for it. A push
# to main builds and tests without publishing: `latest` must mean "the last release", not "the
# last commit".
name: image

on:
  # No `paths:` filter here, deliberately. GitHub applies it to TAG pushes too, evaluating it
  # against the tagged commit — so tagging a release whose commit happened to touch only docs would
  # skip this workflow entirely: no build, no publish, no `latest`, and nothing anywhere saying why.
  # A release that quietly publishes nothing is a worse trade than a pipeline that sometimes runs
  # when it did not need to. Pull requests keep the filter: there, skipping costs nothing.
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, tests/**, scripts/**]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built image to GHCR (otherwise build and test only)
        type: boolean
        default: false

# Declared per job rather than here: the policy and e2e jobs never touch the registry, and a token
# that can write packages while running a test suite is a permission nobody asked for.
permissions:
  contents: read

# Which Kong line `latest` points at. It is a decision, not a side effect of matrix ordering: two
# lines both claiming `latest` is how a `docker pull` silently changes major version.
env:
  LATEST_LINE: '2.8.5'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs without Docker and without an image: a wrong publishing rule must be caught even on a
  # commit where the build itself cannot start.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./tests/policy.sh
      - run: ./tests/changelog.sh
      # A public build recipe must not name the infrastructure it runs on. The rule is in AGENTS.md;
      # this is the part that does not depend on anyone remembering it.
      - run: ./tests/no-internal-data.sh
      # The backlog and roadmap check lives in .github/workflows/backlog.yml, which triggers on the
      # paths that actually feed it — including a docs-only edit, which this workflow ignores.

  # The system test: Keycloak issuing real tokens, an upstream to protect, and the image between
  # them. It builds its own 2.x image (the layer cache makes that cheap) because nothing should be
  # published before the plugins have been shown to DECIDE, not merely to load.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both lines, because they are no longer the same system: 2.x runs the Lua oidc and
      # jwt-keycloak plugins, 3.x runs oidcify as an external plugin server and has no
      # jwt-keycloak at all. A green 2.x says nothing about the 3.x one.
      matrix:
        include:
          # DB-less, all three images.
          - {kong: '2.8.5', variant: '',        db: 'off'}
          - {kong: '2.8.5', variant: 'oidcify', db: 'off'}
          - {kong: '3.9.3', variant: '',        db: 'off'}
          # On Postgres, as production runs. Not for 3.9.3 + oidcify: there, Kong's Admin API root
          # answers 500 with an external plugin registered, so decK cannot configure it at all. That
          # is a Kong bug, written up in docs/end-to-end.md, and one more reason the 3.x image is
          # not publishable yet.
          - {kong: '2.8.5', variant: '',        db: 'postgres'}
          - {kong: '2.8.5', variant: 'oidcify', db: 'postgres'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Base image digest
        id: base
        # Read from the file rather than resolved from the registry: resolving here would pin
        # whatever the registry serves this morning, which is the mutable tag with extra steps.
        run: |
          digest=$(grep -E "^${{ matrix.kong }}=" kong-base-digests.env | cut -d= -f2-)
          [ -n "$digest" ] || { echo "no pinned digest for Kong ${{ matrix.kong }}"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          build-args: |
            KONG_VERSION=${{ matrix.kong }}
            KONG_DIGEST=${{ steps.base.outputs.digest }}
            OIDC_PROVIDER=${{ matrix.variant }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
          tags: kong-gateway:e2e-${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          cache-from: type=gha,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
      - name: End-to-end (storage ${{ matrix.db }})
        run: |
          ./tests/e2e/run.sh \
            ${{ matrix.db != 'off' && format('--db {0}', matrix.db) || '' }} \
            "kong-gateway:e2e-${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}" \
            "${{ matrix.kong }}"

  build:
    needs: [policy, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # 2.8.5 is phase 1 of the upgrade plan.
      # 3.9.3 is the last Kong major with a prebuilt OSS image. Its unmet milestones are declared
      # `expect xfail` in the tests: the job stays green and reports XFAIL in the summary, and turns
      # red only if a milestone regresses (FAIL) or an expected-red one starts passing (XPASS).
      # This job used to be `continue-on-error` — a red nobody was reading any more.
      matrix:
        include:
          - {kong: '2.8.5', variant: ''}         # reproduces what runs today
          - {kong: '2.8.5', variant: 'oidcify'}  # same Kong, maintained OIDC plugin
          - {kong: '3.9.3', variant: ''}         # oidcify is the only option there
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # github.repository keeps the organisation's capitalisation (HiWay-Media), and a Docker
      # reference must be lowercase: buildx refuses the tag outright with "repository name must be
      # lowercase". Computed once here rather than hardcoded, so a fork publishes under its own name.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Base image digest
        id: base
        # Read from the file rather than resolved from the registry: resolving here would pin
        # whatever the registry serves this morning, which is the mutable tag with extra steps.
        run: |
          digest=$(grep -E "^${{ matrix.kong }}=" kong-base-digests.env | cut -d= -f2-)
          [ -n "$digest" ] || { echo "no pinned digest for Kong ${{ matrix.kong }}"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          build-args: |
            KONG_VERSION=${{ matrix.kong }}
            KONG_DIGEST=${{ steps.base.outputs.digest }}
            OIDC_PROVIDER=${{ matrix.variant }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-ci
          cache-from: type=gha,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}

      - name: Milestones (includes the smoke gate — see docs/milestones.md)
        id: milestones
        run: |
          ./tests/run.sh \
            "${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-ci" \
            "${{ matrix.kong }}"

      - name: Login GHCR
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags to publish
        id: tags
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        run: |
          {
            echo 'list<<TAGS_EOF'
            ./scripts/publish-tags.sh \
              "${{ steps.image.outputs.name }}" "${{ matrix.kong }}" "$LATEST_LINE" "$GITHUB_REF" \
              "${{ matrix.variant }}"
            echo TAGS_EOF
          } >>"$GITHUB_OUTPUT"

      - name: Push the image that was tested
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        # `docker tag` and `docker push`, not a second build-push-action. Building again to publish
        # is not the same as publishing what passed: with a warm cache it usually produces identical
        # bits, and "usually" is not a property to rely on for an image that guards authentication.
        # This pushes the exact layers the milestones and the end-to-end suite ran against.
        run: |
          tested="${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-ci"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "==> $tag"
            docker tag "$tested" "$tag"
            docker push "$tag"
          done <<'TAGS'
          ${{ steps.tags.outputs.list }}
          TAGS

      - name: Record what was published
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        # One file per matrix entry, collected by the release job. A release that lists the digests
        # it actually pushed is the difference between a changelog and an artefact you can pin.
        run: |
          name="${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}"
          image="${{ steps.image.outputs.name }}:$name"
          # println, and not the bare field reference: without it buildx prints its whole default
          # description instead of the digest, and the first run of this step recorded three lines
          # of prose where a digest belonged.
          digest=$(docker buildx imagetools inspect "$image" --format '{{println .Manifest.Digest}}' | head -1)
          case "$digest" in
            sha256:*) ;;
            # A malformed digest is worse than a missing one: it lands in release notes that people
            # copy into deployments.
            *) echo "::error::did not get a digest for $image, got: $digest"; exit 1 ;;
          esac
          mkdir -p published
          printf '%s@%s\n' "$image" "$digest" >"published/$name.txt"

      - name: Upload what was published
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: published/

      - name: Digest to pin in deployments
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        run: |
          echo "::notice::Pin THIS digest in your job specs, not the tag. A tag can be repushed underneath a running deployment; a digest cannot."
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}" \
            --format '{{println .Manifest.Digest}}'

  # The release is created from the tag, with the changelog section as its body and the digests that
  # were actually pushed listed underneath. It runs after the images exist, so it can only describe
  # what is really there — a release written first and published later is a promise, not a record.
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Collect the published digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-*
          path: published
          merge-multiple: true
        continue-on-error: true

      - name: Write the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(mktemp)
          ./scripts/release-notes.sh "$version" >"$notes" || {
            echo "::error::no CHANGELOG section for $version — the tag claims a release the changelog does not describe"
            exit 1
          }
          {
            echo
            echo '## Images published by this release'
            echo
            if compgen -G 'published/*.txt' >/dev/null; then
              echo '```'
              cat published/*.txt
              echo '```'
              echo
              echo 'Pin the digest in deployments, never the tag: a tag can be repushed underneath a'
              echo 'running workload, a digest cannot.'
            else
              echo 'None. Every line was either unpublishable — a milestone still declared `XFAIL` —'
              echo 'or this tag changed nothing that is built.'
            fi
          } >>"$notes"
          # `gh release create` answered HTTP 500 on the first real tag while the plain API call
          # for the same release succeeded, so the release is created through the API and edited if
          # it already exists. Re-running a tag's workflow then updates the notes instead of failing
          # on a release that is already there.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
              -f body="$(cat "$notes")" >/dev/null
          fi
          echo "::notice::release $GITHUB_REF_NAME written from the changelog"
