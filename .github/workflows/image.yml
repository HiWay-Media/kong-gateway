# Builds the Kong image, tests it against the milestone suite, and publishes it to GHCR.
#
# The order is deliberate: nothing is published before the milestone suite passes. The gate checks
# that kong-path-allow is a working authorization control, not merely a file that exists — a plugin
# that loads but no longer blocks anything would pass any healthcheck and be invisible to whoever
# pulls the image.
#
# Publishing happens only from an annotated `v*` tag or a manual dispatch that asks for it. A push
# to main builds and tests without publishing: `latest` must mean "the last release", not "the
# last commit".
name: image

on:
  # No `paths:` filter here, deliberately. GitHub applies it to TAG pushes too, evaluating it
  # against the tagged commit — so tagging a release whose commit happened to touch only docs would
  # skip this workflow entirely: no build, no publish, no `latest`, and nothing anywhere saying why.
  # A release that quietly publishes nothing is a worse trade than a pipeline that sometimes runs
  # when it did not need to. Pull requests keep the filter: there, skipping costs nothing.
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, tests/**, scripts/**]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built image to GHCR (otherwise build and test only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Which Kong line `latest` points at. It is a decision, not a side effect of matrix ordering: two
# lines both claiming `latest` is how a `docker pull` silently changes major version.
env:
  LATEST_LINE: '2.8.5'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs without Docker and without an image: a wrong publishing rule must be caught even on a
  # commit where the build itself cannot start.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/policy.sh
      # The backlog and the roadmap: the roadmap is generated from the milestone tests and the
      # backlog, so this fails when someone edits one and forgets the other — which is the only
      # failure mode a roadmap really has.
      - run: python3 scripts/backlog.py check

  # The system test: Keycloak issuing real tokens, an upstream to protect, and the image between
  # them. It builds its own 2.x image (the layer cache makes that cheap) because nothing should be
  # published before the plugins have been shown to DECIDE, not merely to load.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both lines, because they are no longer the same system: 2.x runs the Lua oidc and
      # jwt-keycloak plugins, 3.x runs oidcify as an external plugin server and has no
      # jwt-keycloak at all. A green 2.x says nothing about the 3.x one.
      matrix:
        include:
          # DB-less, all three images.
          - {kong: '2.8.5', variant: '',        db: 'off'}
          - {kong: '2.8.5', variant: 'oidcify', db: 'off'}
          - {kong: '3.9.3', variant: '',        db: 'off'}
          # On Postgres, as production runs. Not for 3.9.3 + oidcify: there, Kong's Admin API root
          # answers 500 with an external plugin registered, so decK cannot configure it at all. That
          # is a Kong bug, written up in docs/end-to-end.md, and one more reason the 3.x image is
          # not publishable yet.
          - {kong: '2.8.5', variant: '',        db: 'postgres'}
          - {kong: '2.8.5', variant: 'oidcify', db: 'postgres'}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            KONG_VERSION=${{ matrix.kong }}
            OIDC_PROVIDER=${{ matrix.variant }}
          tags: kong-gateway:e2e-${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          cache-from: type=gha,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
      - name: End-to-end (storage ${{ matrix.db }})
        run: |
          ./tests/e2e/run.sh \
            ${{ matrix.db != 'off' && format('--db {0}', matrix.db) || '' }} \
            "kong-gateway:e2e-${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}" \
            "${{ matrix.kong }}"

  build:
    needs: [policy, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 2.8.5 is phase 1 of the upgrade plan.
      # 3.9.3 is the last Kong major with a prebuilt OSS image. Its unmet milestones are declared
      # `expect xfail` in the tests: the job stays green and reports XFAIL in the summary, and turns
      # red only if a milestone regresses (FAIL) or an expected-red one starts passing (XPASS).
      # This job used to be `continue-on-error` — a red nobody was reading any more.
      matrix:
        include:
          - {kong: '2.8.5', variant: ''}         # reproduces what runs today
          - {kong: '2.8.5', variant: 'oidcify'}  # same Kong, maintained OIDC plugin
          - {kong: '3.9.3', variant: ''}         # oidcify is the only option there
    steps:
      - uses: actions/checkout@v4

      # github.repository keeps the organisation's capitalisation (HiWay-Media), and a Docker
      # reference must be lowercase: buildx refuses the tag outright with "repository name must be
      # lowercase". Computed once here rather than hardcoded, so a fork publishes under its own name.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            KONG_VERSION=${{ matrix.kong }}
            OIDC_PROVIDER=${{ matrix.variant }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-ci
          cache-from: type=gha,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}

      - name: Milestones (includes the smoke gate — see docs/milestones.md)
        id: milestones
        run: |
          ./tests/run.sh \
            "${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}-ci" \
            "${{ matrix.kong }}"

      - name: Login GHCR
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags to publish
        id: tags
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        run: |
          {
            echo 'list<<TAGS_EOF'
            ./scripts/publish-tags.sh \
              "${{ steps.image.outputs.name }}" "${{ matrix.kong }}" "$LATEST_LINE" "$GITHUB_REF" \
              "${{ matrix.variant }}"
            echo TAGS_EOF
          } >>"$GITHUB_OUTPUT"

      - name: Push
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            KONG_VERSION=${{ matrix.kong }}
            OIDC_PROVIDER=${{ matrix.variant }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}

      - name: Digest to pin in deployments
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && steps.milestones.outputs.publishable == 'true'
        run: |
          echo "::notice::Pin THIS digest in your job specs, not the tag. A tag can be repushed underneath a running deployment; a digest cannot."
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ matrix.kong }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}" \
            --format '{{println .Manifest.Digest}}'
