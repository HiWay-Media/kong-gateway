# Builda l'immagine Kong di HiWay Media, la testa, e la pubblica su GHCR.
#
# L'ordine è deliberato: niente viene pubblicato prima che lo smoke test passi. Il test verifica che
# kong-path-allow sia un controllo di autorizzazione funzionante, non solo un file presente — un
# plugin che carica ma non blocca più nulla passerebbe qualsiasi healthcheck e sarebbe invisibile
# a chi fa il pull.
#
# Si pubblica solo da un tag annotato `v*` o da un dispatch manuale che lo chiede. Un push su main
# builda e testa senza pubblicare: `latest` deve voler dire "l'ultima release", non "l'ultimo commit".
name: image

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Dockerfile, .dockerignore, tests/**, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, tests/**]
  workflow_dispatch:
    inputs:
      publish:
        description: Pubblica su GHCR (altrimenti solo build e test)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 2.8.5 è la linea da portare in produzione (fase 1 del piano di upgrade).
      # 3.9.3 è l'ultima con immagine OSS prebuilt, e qui è ATTESA ROSSA finché non si decide
      # cosa mettere al posto di oidc e jwt-keycloak. Serve a misurare la distanza, non a passare.
      matrix:
        kong: ['2.8.5', '3.9.3']
    continue-on-error: ${{ startsWith(matrix.kong, '3.') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: KONG_VERSION=${{ matrix.kong }}
          tags: ${{ env.IMAGE }}:${{ matrix.kong }}-ci
          cache-from: type=gha,scope=${{ matrix.kong }}
          cache-to: type=gha,mode=max,scope=${{ matrix.kong }}

      - name: Smoke test
        run: ./tests/smoke.sh "${{ env.IMAGE }}:${{ matrix.kong }}-ci" "${{ matrix.kong }}"

      - name: Login GHCR
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: KONG_VERSION=${{ matrix.kong }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.kong }}
            ${{ env.IMAGE }}:${{ matrix.kong }}-${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.kong }}

      - name: Digest da pinnare nei job Nomad
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          echo "::notice::Pinnare QUESTO digest nei payload, non il tag — lezione s3-proxy (v0.12.0)."
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ matrix.kong }}" \
            --format '{{println .Manifest.Digest}}'
