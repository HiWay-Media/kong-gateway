name: pages

# Publishes docs/ to https://hiway-media.github.io/kong-gateway/.
#
# The repository's Pages source must be set to "GitHub Actions", otherwise this workflow builds a
# site that nothing serves.
#
# A pull request builds with --strict and publishes nothing, so a broken link or a missing nav entry
# fails the check rather than the site.

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # Without this, setup-python looks for requirements.txt or pyproject.toml, finds neither,
          # and fails the job before a single page is built.
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
