# Pinning by SHA answers "can this change under us". It creates the opposite question — "is this
# still the version we think it is" — and dependabot is the answer to that one: it bumps SHA-pinned
# actions and rewrites the version comment with them.
#
# Without this, pinning would trade a supply-chain risk for a staleness one and call it progress.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docs)"
